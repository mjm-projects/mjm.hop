name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/hop-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/hop-derived" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Package unsigned app
        run: |
          tar -czf "$RUNNER_TEMP/Hop-unsigned-macos.tar.gz" \
            -C "$RUNNER_TEMP/hop-derived/Build/Products/Debug" Hop.app
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Hop-unsigned-macos
          path: ${{ runner.temp }}/Hop-unsigned-macos.tar.gz
          if-no-files-found: error
